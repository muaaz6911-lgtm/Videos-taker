<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Media Extractor</title>

<style>

/* =====================
   VARIABLES
===================== */

:root {
    --primary: #7c4dff;
    --secondary: #a855f7;
    --glow: rgba(124, 77, 255, 0.45);
}


/* =====================
   RESET
===================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* =====================
   BODY
===================== */

body {

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #09071a,
            #17113a,
            #09071a
        );

    color: white;

    overflow-x: hidden;

    padding: 25px;

}


/* =====================
   BACKGROUND GLOW
===================== */

.orb {

    position: fixed;

    border-radius: 50%;

    filter: blur(90px);

    opacity: 0.35;

    z-index: -1;

    animation: float 8s ease-in-out infinite;

}

.orb1 {

    width: 280px;
    height: 280px;

    background: var(--primary);

    top: -100px;
    left: -100px;

}

.orb2 {

    width: 300px;
    height: 300px;

    background: var(--secondary);

    bottom: -120px;
    right: -100px;

    animation-delay: 2s;

}


/* =====================
   MENU BUTTON
===================== */

.menu-btn {

    position: fixed;

    top: 22px;
    right: 22px;

    width: 50px;
    height: 50px;

    border: none;

    border-radius: 15px;

    background:
        rgba(255,255,255,0.1);

    border:
        1px solid
        rgba(255,255,255,0.15);

    backdrop-filter: blur(20px);

    color: white;

    font-size: 24px;

    cursor: pointer;

    z-index: 9999;

    transition: 0.3s;

}

.menu-btn:hover {

    transform: scale(1.08);

}


/* =====================
   MENU PANEL
===================== */

.menu-panel {

    position: fixed;

    top: 82px;
    right: 22px;

    width: 230px;

    padding: 20px;

    border-radius: 20px;

    background:
        rgba(20,15,45,0.92);

    backdrop-filter: blur(25px);

    border:
        1px solid
        rgba(255,255,255,0.15);

    box-shadow:
        0 15px 45px
        rgba(0,0,0,0.5);

    z-index: 9998;

    opacity: 0;

    transform:
        translateY(-10px)
        scale(0.95);

    pointer-events: none;

    transition: 0.3s;

}

.menu-panel.show {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;

}

.menu-panel h3 {

    margin-bottom: 18px;

    font-size: 16px;

    color: white;

}


/* =====================
   COLOR GRID
===================== */

.colors {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 14px;

}

.color {

    width: 38px;
    height: 38px;

    border-radius: 50%;

    cursor: pointer;

    border:
        2px solid
        rgba(255,255,255,0.3);

    transition: 0.25s;

}

.color:hover {

    transform: scale(1.2);

    border-color: white;

}


/* =====================
   MAIN WRAPPER
===================== */

.main {

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    padding-top: 20px;

}


/* =====================
   WEBSITE NAME
===================== */

.brand {

    text-align: center;

    margin-bottom: 28px;

    animation:
        brandAppear
        1s ease;

}

.brand h1 {

    font-size: 48px;

    letter-spacing: 4px;

    font-weight: 800;

    background:
        linear-gradient(
            90deg,
            white,
            var(--primary),
            white
        );

    background-size: 200%;

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

    animation:
        shine
        5s linear infinite;

}

.brand p {

    margin-top: 10px;

    color: #bdbdbd;

    font-size: 15px;

    letter-spacing: 1px;

}


/* =====================
   GLASS CARD
===================== */

.container {

    width: 100%;

    max-width: 600px;

    padding: 35px;

    border-radius: 28px;

    background:
        rgba(255,255,255,0.08);

    backdrop-filter: blur(25px);

    border:
        1px solid
        rgba(255,255,255,0.16);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,0.4);

    text-align: center;

    animation:
        cardAppear
        0.8s ease;

}


/* =====================
   FORMAT BUTTONS
===================== */

.mode {

    display: flex;

    gap: 15px;

    margin-bottom: 25px;

}

.mode button {

    flex: 1;

    padding: 16px;

    border: none;

    border-radius: 15px;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid
        rgba(255,255,255,0.1);

    color: white;

    font-size: 16px;

    cursor: pointer;

    transition: 0.3s;

}

.mode button:hover {

    transform:
        translateY(-3px);

}

.mode button.active {

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );

    box-shadow:
        0 7px 25px
        var(--glow);

}


/* =====================
   URL INPUT
===================== */

input {

    width: 100%;

    padding: 18px;

    border-radius: 15px;

    border:
        1px solid
        rgba(255,255,255,0.12);

    outline: none;

    background:
        rgba(255,255,255,0.08);

    color: white;

    font-size: 15px;

    margin-bottom: 18px;

    transition: 0.3s;

}

input:focus {

    border-color:
        var(--primary);

    box-shadow:
        0 0 20px
        var(--glow);

}

input::placeholder {

    color: #aaa;

}


/* =====================
   DOWNLOAD BUTTON
===================== */

.extract {

    width: 100%;

    padding: 18px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            90deg,
            var(--primary),
            var(--secondary)
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 10px 30px
        var(--glow);

    transition: 0.3s;

}

.extract:hover {

    transform:
        translateY(-3px);

}

.extract:disabled {

    opacity: 0.6;

    cursor: not-allowed;

}


/* =====================
   STATUS
===================== */

.status {

    min-height: 24px;

    margin-top: 20px;

    color: #d0d0d0;

    font-size: 14px;

}


/* =====================
   ANIMATIONS
===================== */

@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateY(40px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}

@keyframes brandAppear {

    from {

        opacity: 0;

        transform:
            translateY(-25px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}

@keyframes shine {

    0% {

        background-position: 0%;

    }

    100% {

        background-position: 200%;

    }

}

@keyframes float {

    0%,
    100% {

        transform:
            translate(0,0);

    }

    50% {

        transform:
            translate(30px,40px);

    }

}


/* =====================
   MOBILE
===================== */

@media (max-width: 600px) {

    body {

        padding: 15px;

    }

    .brand h1 {

        font-size: 34px;

        letter-spacing: 2px;

    }

    .container {

        padding: 25px 20px;

    }

    .menu-btn {

        top: 15px;
        right: 15px;

    }

    .menu-panel {

        top: 75px;
        right: 15px;

    }

}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div class="orb orb1"></div>
<div class="orb orb2"></div>


<!-- MENU -->

<button
    class="menu-btn"
    onclick="toggleMenu()"
>
☰
</button>


<div
    class="menu-panel"
    id="menuPanel"
>

    <h3>🎨 Choose Theme</h3>


    <div class="colors">

        <div
            class="color"
            style="background:#7c4dff"
            onclick="setTheme('purple')"
        ></div>

        <div
            class="color"
            style="background:#2196f3"
            onclick="setTheme('blue')"
        ></div>

        <div
            class="color"
            style="background:#00c853"
            onclick="setTheme('green')"
        ></div>

        <div
            class="color"
            style="background:#ff1744"
            onclick="setTheme('red')"
        ></div>

        <div
            class="color"
            style="background:#ff9800"
            onclick="setTheme('orange')"
        ></div>

        <div
            class="color"
            style="background:#e91e63"
            onclick="setTheme('pink')"
        ></div>

        <div
            class="color"
            style="background:#00bcd4"
            onclick="setTheme('cyan')"
        ></div>

        <div
            class="color"
            style="background:#ffffff"
            onclick="setTheme('white')"
        ></div>

    </div>

</div>


<!-- MAIN -->

<div class="main">


    <!-- NAME TOP -->

    <div class="brand">

        <h1>MEDIA EXTRACTOR</h1>

        <p>
            Extract • Convert • Download
        </p>

    </div>


    <!-- GLASS CARD -->

    <div class="container">


        <!-- FORMAT -->

        <div class="mode">

            <button
                class="active"
                onclick="setMode('mp4', this)"
            >
                🎬 MP4
            </button>


            <button
                onclick="setMode('mp3', this)"
            >
                🎵 MP3
            </button>

        </div>


        <!-- URL -->

        <input

            type="text"

            id="urlInput"

            placeholder="Paste your media URL here..."

        >


        <!-- BUTTON -->

        <button

            class="extract"

            id="extractButton"

            onclick="extractMedia()"

        >

            DOWNLOAD MP4

        </button>


        <!-- STATUS -->

        <div
            class="status"
            id="status"
        ></div>


    </div>


</div>


<script>


let selectedMode = "mp4";


/* =====================
   MENU
===================== */

function toggleMenu() {

    document
        .getElementById("menuPanel")
        .classList.toggle("show");

}


/* =====================
   THEMES
===================== */

function setTheme(theme) {


    const themes = {

        purple: [
            "#7c4dff",
            "#a855f7",
            "rgba(124,77,255,0.45)"
        ],

        blue: [
            "#2196f3",
            "#00bcd4",
            "rgba(33,150,243,0.45)"
        ],

        green: [
            "#00c853",
            "#00e676",
            "rgba(0,200,83,0.45)"
        ],

        red: [
            "#ff1744",
            "#ff5252",
            "rgba(255,23,68,0.45)"
        ],

        orange: [
            "#ff9800",
            "#ff5722",
            "rgba(255,152,0,0.45)"
        ],

        pink: [
            "#e91e63",
            "#ff4081",
            "rgba(233,30,99,0.45)"
        ],

        cyan: [
            "#00bcd4",
            "#18ffff",
            "rgba(0,188,212,0.45)"
        ],

        white: [
            "#999999",
            "#ffffff",
            "rgba(255,255,255,0.4)"
        ]

    };


    const root =
        document.documentElement;


    root.style.setProperty(
        "--primary",
        themes[theme][0]
    );


    root.style.setProperty(
        "--secondary",
        themes[theme][1]
    );


    root.style.setProperty(
        "--glow",
        themes[theme][2]
    );


    document
        .getElementById("menuPanel")
        .classList.remove("show");

}


/* =====================
   FORMAT MODE
===================== */

function setMode(mode, button) {


    selectedMode = mode;


    document
        .querySelectorAll(".mode button")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    document
        .getElementById("extractButton")
        .innerText =

            mode === "mp3"

            ? "CONVERT TO MP3"

            : "DOWNLOAD MP4";

}


/* =====================
   EXTRACT MEDIA
===================== */

async function extractMedia() {


    const url =
        document
        .getElementById("urlInput")
        .value
        .trim();


    const status =
        document
        .getElementById("status");


    const button =
        document
        .getElementById("extractButton");


    if (!url) {

        status.innerText =
            "⚠️ Please paste a media URL first.";

        return;

    }


    button.disabled = true;


    button.innerText =
        "⏳ PROCESSING...";


    status.innerText =

        selectedMode === "mp3"

        ? "🎵 Converting media..."

        : "🎬 Preparing media...";


    try {


        const response =
            await fetch(

                "/api/extract",

                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            url: url,

                            mode: selectedMode

                        })

                }

            );


        if (!response.ok) {


            const error =
                await response.json();


            throw new Error(
                error.message
                ||
                "Processing failed"
            );

        }


        const blob =
            await response.blob();


        const downloadUrl =
            URL.createObjectURL(blob);


        const link =
            document.createElement("a");


        link.href =
            downloadUrl;


        link.download =

            selectedMode === "mp3"

            ? "media.mp3"

            : "media.mp4";


        document.body.appendChild(link);


        link.click();


        link.remove();


        URL.revokeObjectURL(
            downloadUrl
        );


        status.innerText =
            "✅ Download started!";


    }


    catch (error) {


        status.innerText =
            "❌ " + error.message;

    }


    button.disabled = false;


    button.innerText =

        selectedMode === "mp3"

        ? "CONVERT TO MP3"

        : "DOWNLOAD MP4";

}


</script>


</body>
</html>
