<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Media Extractor</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 600px;
    padding: 45px 30px;
    border-radius: 25px;

    background: rgba(255,255,255,0.08);

    backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);

    box-shadow: 0 8px 32px rgba(0,0,0,0.4);

    text-align: center;

    animation: appear 0.8s ease;
}

h1 {
    font-size: 42px;
    margin-bottom: 10px;
    letter-spacing: 2px;
}

.subtitle {
    color: #cfcfcf;
    margin-bottom: 35px;
}

.mode {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

.mode button {
    flex: 1;
    padding: 14px;

    border: none;
    border-radius: 12px;

    background: rgba(255,255,255,0.08);

    color: white;

    cursor: pointer;

    transition: 0.3s;
}

.mode button.active {
    background: #7c4dff;
}

.mode button:hover {
    transform: translateY(-2px);
}

input {
    width: 100%;
    padding: 17px;

    border: none;
    border-radius: 12px;

    outline: none;

    margin-bottom: 18px;

    background: rgba(255,255,255,0.12);

    color: white;

    font-size: 15px;
}

input::placeholder {
    color: #bdbdbd;
}

.extract {
    width: 100%;

    padding: 17px;

    border: none;
    border-radius: 12px;

    background: linear-gradient(90deg,#7c4dff,#a855f7);

    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.extract:hover {
    transform: scale(1.02);
}

.status {
    margin-top: 20px;

    color: #cfcfcf;

    min-height: 20px;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}
</style>

</head>

<body>

<div class="container">

    <h1>MEDIA EXTRACTOR</h1>

    <p class="subtitle">
        Extract and process your media
    </p>


    <div class="mode">

        <button class="active" onclick="setMode('mp4', this)">
            🎬 MP4
        </button>

        <button onclick="setMode('mp3', this)">
            🎵 MP3
        </button>

    </div>


    <input
        type="text"
        id="urlInput"
        placeholder="Paste your media URL here..."
    >


    <button
        class="extract"
        onclick="extractMedia()"
    >
        EXTRACT MEDIA
    </button>


    <div
        class="status"
        id="status"
    ></div>


</div>


<script>

let selectedMode = "mp4";


function setMode(mode, button) {

    selectedMode = mode;

    document
        .querySelectorAll(".mode button")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    document.querySelector(".extract").innerText =
        mode === "mp3"
        ? "CONVERT TO MP3"
        : "DOWNLOAD MP4";

}


function extractMedia() {

    const url = document
        .getElementById("urlInput")
        .value
        .trim();


    const status =
        document.getElementById("status");


    if (!url) {

        status.innerText =
            "⚠️ Please paste a media URL first.";

        return;

    }


    status.innerText =
        selectedMode === "mp3"
        ? "🎵 Preparing MP3..."
        : "🎬 Preparing media...";


    // Backend connection next step 🔥

}

</script>

</body>
</html>
